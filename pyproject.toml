[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azmcp"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "U.N. Owen", email = "'linus.mcmanamey@dpfem.tas.gov.au'" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "textual>=0.41.0",
  "azure-devops>=7.1.0b4",
  "azure-identity>=1.15.0",
  "icecream>=2.1.3",
  "loguru>=0.7.2",
  "httpx>=0.24.0",
  "pydantic>=2.0.0",
  "typer>=0.9.0",
]

[project.scripts]
azmcp = "azmcp.cli:main"
azmcp-app = "azmcp.app:main"

[project.urls]
Documentation = "https://github.com/linus-mcmanamey/azmcp#readme"
Issues = "https://github.com/linus-mcmanamey/azmcp/issues"
Source = "https://github.com/linus-mcmanamey/azmcp"

[tool.hatch.version]
path = "src/azmcp/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/azmcp tests}"

[tool.coverage.run]
source_pkgs = ["azmcp", "tests"]
branch = true
parallel = true
omit = [
  "src/azmcp/__about__.py",
]

[tool.coverage.paths]
azmcp = ["src/azmcp", "*/azmcp/src/azmcp"]
tests = ["tests", "*/azmcp/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
